---
- name: Check if kubectl exists
  ansible.builtin.stat:
    path: /usr/local/bin/kubectl
  register: kubectl_stat
  ignore_errors: yes

- name: Download kubectl v1.29.0
  become: yes
  ansible.builtin.get_url:
    url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
    dest: /usr/local/bin/kubectl
    mode: "0755"
  when: not kubectl_stat.stat.exists

- name: Check minikube status
  ansible.builtin.command: minikube status
  register: mk_status
  ignore_errors: yes
  changed_when: false

- name: Start or recover minikube if not running
  when: mk_status.rc != 0
  block:
    - name: Start minikube using existing profile settings
      ansible.builtin.command: >-
        minikube start --driver=docker --memory={{ minikube_memory }}
        --cpus={{ minikube_cpus }}
  rescue:
    - name: Start minikube with requested Kubernetes version
      ansible.builtin.command: >-
        minikube start --driver=docker --memory={{ minikube_memory }}
        --cpus={{ minikube_cpus }} --kubernetes-version={{ minikube_kubernetes_version | default('v1.29.0') }}
      register: mk_versioned_start
      ignore_errors: yes

    - name: Reset broken minikube profile as last resort
      ansible.builtin.command: minikube delete --all --purge
      changed_when: false
      when: mk_versioned_start.rc != 0

    - name: Start minikube after reset
      ansible.builtin.command: >-
        minikube start --driver=docker --memory={{ minikube_memory }}
        --cpus={{ minikube_cpus }} --kubernetes-version={{ minikube_kubernetes_version | default('v1.29.0') }}
      when: mk_versioned_start.rc != 0

- name: Enable metrics-server
  ansible.builtin.command: minikube addons enable metrics-server
  changed_when: false

- name: Create Kubernetes namespace
  ansible.builtin.shell: kubectl create namespace {{ k8s_namespace }} --dry-run=client -o yaml | kubectl apply -f -
  changed_when: false

- name: Verify node Ready
  ansible.builtin.command: kubectl get nodes
  register: nodes_output
  changed_when: false
  when: not ansible_check_mode

- name: Assert node is Ready
  ansible.builtin.assert:
    that:
      - "'Ready' in nodes_output.stdout"
    fail_msg: "Kubernetes node is not Ready."
    success_msg: "Kubernetes node is Ready."
  when: not ansible_check_mode
